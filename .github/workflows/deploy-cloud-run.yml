name: Deploy to Cloud Run

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/omnipsyche:${{ github.sha }}
  MIGRATOR_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/omnipsyche-migrator:${{ github.sha }}
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omnipsyche?schema=public
  AUTH_SECRET: ci-secret
  NEXTAUTH_SECRET: ci-secret
  NEXTAUTH_URL: http://localhost:3000
  AUTH_URL: http://localhost:3000
  AUTH_TRUST_HOST: "true"
  GEMINI_API_KEY: dummy
  DEVIL_AI_API_KEY: dummy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build service image
        run: docker build --target runner --tag "${IMAGE}" .

      - name: Build migration image
        run: docker build --target migrator --tag "${MIGRATOR_IMAGE}" .

      - name: Push service image
        run: docker push "${IMAGE}"

      - name: Push migration image
        run: docker push "${MIGRATOR_IMAGE}"

      - name: Run database migrations
        run: >-
          gcloud run jobs deploy "${{ vars.CLOUD_RUN_MIGRATION_JOB }}"
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region="${{ vars.GCP_REGION }}"
          --image="${MIGRATOR_IMAGE}"
          --service-account="${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}"
          --set-cloudsql-instances="${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}"
          --set-secrets=DATABASE_URL=DATABASE_URL:latest
          --tasks=1
          --parallelism=1
          --max-retries=0
          --task-timeout=10m
          --wait
          --quiet

      - name: Deploy service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          env_vars: |-
            NODE_ENV=production
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }}
            AUTH_URL=${{ vars.AUTH_URL }}
            AUTH_TRUST_HOST=true
            GEMINI_API_PRIMARY_MODEL=gemini-3.5-flash
            GEMINI_API_FALLBACK_MODEL=gemini-2.5-flash
            ENABLE_AI_MODEL_FALLBACK=true
            DEVIL_AI_BASE_URL=https://api.devil.ai/v1
            DEVIL_AI_LANG=en
          env_vars_update_strategy: overwrite
          secrets: |-
            DATABASE_URL=DATABASE_URL:latest
            AUTH_SECRET=AUTH_SECRET:latest
            NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            DEVIL_AI_API_KEY=DEVIL_AI_API_KEY:latest
          secrets_update_strategy: overwrite
          flags: >-
            --platform=managed
            --port=8080
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --service-account=${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
            --set-cloudsql-instances=${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}

      - name: Show deployed URL
        run: echo "${{ steps.deploy.outputs.url }}"
